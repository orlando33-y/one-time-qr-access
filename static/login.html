<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Antre | Kòd yon sèl fwa</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/pages-login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="wordmark" href="/" aria-label="Kòd yon sèl fwa"><span class="wordmark-mark" aria-hidden="true">Q</span><span>yon sèl fwa<span class="wordmark-dot">.</span></span></a>
    <section class="login-content">
      <p class="eyebrow">ZÒN ADMINISTRASYON</p>
      <h1>Bon retou.</h1>
      <p class="login-intro">Antre pou jere kòd aksè ou yo.</p>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <form id="login-form" class="login-form">
        <label for="password">Modpas admin</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="button button-dark button-wide" type="submit">Antre nan kont lan <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p class="login-note">Pa pataje modpas admin lan ak lòt moun.</p>
    </section>
    <footer class="login-footer">KÒD AKSÈ <span>·</span> YON SÈL ITILIZASYON</footer>
  </main>
</body>
</html>
